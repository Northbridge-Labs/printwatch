name: printwatch

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-printwatch}
      POSTGRES_USER: ${POSTGRES_USER:-printwatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-printwatch}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-printwatch}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: valkey/valkey:7
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkeydata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  valkeydata:
  spool: